name: Swordhealth
description: 'Sword Health is a digital musculoskeletal (MSK) care provider that
  combines AI with licensed clinicians to deliver individualized physical therapy,
  chronic and post-surgical pain treatment, and pelvic and movement health programs
  to members from home. It sells primarily to employers and health plans, and in
  2025 launched Sword360, a physical-health data platform. As of this enrichment
  pass Sword Health publishes no public developer API, OpenAPI, SDK, or developer
  portal; its public technical surface is a trust center (SOC 2, HIPAA, GDPR), a
  GitHub organization, and its member/clinician applications. Backed by Bond Capital
  and Khosla Ventures. Sector: healthtech.'
